label: "halos-flash"
grub2:
  timeout: 5
  entries:
    # Guided (#42): picks the disk and asks only encryption, root and the admin user.
    # inst.ks reads the kickstart from the boot image, where the Containerfile puts it.
    - name: "Install halOS (@EDITION@)"
      linux: ${kernelpath} ${root} inst.ks=file:/halos-guided.ks inst.text console=ttyS0 console=tty0
      initrd: ${initrdpath}
    - name: "Install halOS (@EDITION@, custom partitioning)"
      linux: ${kernelpath} ${root} inst.graphical console=ttyS0 console=tty0
      initrd: ${initrdpath}
    # For the VM install test: answers from a volume labelled HALOS_ANSWERS, nothing asked.
    # Without this entry's halos.unattended=1, such a volume is ignored.
    - name: "Install halOS (@EDITION@, unattended test install)"
      linux: ${kernelpath} ${root} inst.ks=file:/halos-guided.ks inst.text halos.unattended=1 console=ttyS0 console=tty0
      initrd: ${initrdpath}
