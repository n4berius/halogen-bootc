# Start a serial login prompt only on a port that answers. Every install so far boots with
# console=ttyS0 (Anaconda copies the installer's console= arguments), so systemd starts a getty on
# ttyS0. On machines where that port exists but doesn't work (freyja), agetty failed with
# "failed to get terminal attributes: Input/output error" and restarted every 10 s, forever.
# stty makes the same check first: on a dead port the getty is skipped, which Restart=always
# doesn't retry; on a working one (a VM, a BMC console) nothing changes. Its output goes nowhere:
# systemd gives this command the terminal, and stty would print the port's settings on it before
# every login prompt. ($$1 is the shell's $1; systemd would read $1 itself.)
[Service]
ExecCondition=/usr/bin/sh -c 'exec /usr/bin/stty -F "/dev/$$1" >/dev/null 2>&1' sh %I
