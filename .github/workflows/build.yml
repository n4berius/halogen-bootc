name: Build OS image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly rebuild of edge, so machines that follow it (freyja) get Fedora's security fixes
  # even in weeks with no change to this repository. A scheduled run always builds, since
  # there is no previous commit to compare with.
  schedule:
    - cron: "37 5 * * 4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    # id-token: signing the pushed edge image with GitHub's identity (scripts/sign-image.sh).
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant: [npu, no-npu]
    env:
      HALOGEN_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run checks
        run: tests/run.sh
      - name: See whether the image changed
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null \
             || git diff --name-only "$BASE" HEAD | scripts/needs-build.sh; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Only docs or repository files changed, so the build is skipped."
          fi
      - name: Build
        if: steps.changes.outputs.build == 'true'
        run: scripts/build.sh
      - name: Push
        # Only main publishes edge; its signature names main (scripts/sign-image.sh).
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.changes.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          edge="$(scripts/image-ref.sh | sed 's/:[^:]*$//'):edge$([ "$HALOGEN_VARIANT" = npu ] || echo -no-npu)"
          podman push "$(scripts/image-ref.sh)" "$edge"
          GITHUB_TOKEN="$GH_TOKEN" scripts/sign-image.sh "$edge"
