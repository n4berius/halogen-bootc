name: Build HalogenOS
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run checks
        run: tests/run.sh
      - name: Build
        run: scripts/build.sh "ghcr.io/${GITHUB_REPOSITORY,,}:45"
      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push "ghcr.io/${GITHUB_REPOSITORY,,}:45"
