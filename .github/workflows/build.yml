name: Build OS image
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [npu, no-npu]
    env:
      HALOGEN_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - name: Run checks
        run: tests/run.sh
      - name: Build
        run: scripts/build.sh
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="$(scripts/image-ref.sh)"
          latest="${image%:*}:latest"
          [ "$HALOGEN_VARIANT" = npu ] || latest="$latest-no-npu"
          podman push "$image"
          podman push "$image" "$latest"
