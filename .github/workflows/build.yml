name: Build OS image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [npu, no-npu]
    env:
      HALOGEN_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run checks
        run: tests/run.sh
      - name: See whether the image changed
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null \
             || git diff --name-only "$BASE" HEAD | scripts/needs-build.sh; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Only docs or repository files changed, so the build is skipped."
          fi
      - name: Build
        if: steps.changes.outputs.build == 'true'
        run: scripts/build.sh
      - name: Push
        if: github.event_name != 'pull_request' && steps.changes.outputs.build == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push "$(scripts/image-ref.sh)" "$(scripts/image-ref.sh | sed 's/:[^:]*$//'):edge$([ "$HALOGEN_VARIANT" = npu ] || echo -no-npu)"
