name: Refresh stable with Fedora updates
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [npu, no-npu]
    # id-token: signing the rebuilt images with GitHub's identity (scripts/sign-image.sh).
    permissions:
      contents: read
      packages: write
      id-token: write
    # Shared with release.yml's image job: one push moves an edition's channel tags at a time.
    concurrency:
      group: channel-tags-${{ matrix.variant }}
      cancel-in-progress: false
    env:
      HALOGEN_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find the newest stable release
        id: stable
        run: |
          tag="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-r[0-9]+)?$' | head -1 || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # main's channel script, kept aside: the release checked out next may predate it.
          cp scripts/channels.sh "$RUNNER_TEMP/channels.sh"
          cp scripts/sign-image.sh "$RUNNER_TEMP/sign-image.sh"
      - if: steps.stable.outputs.tag != ''
        env:
          TAG: ${{ steps.stable.outputs.tag }}
        run: git checkout "$TAG"
      - name: Rebuild and push
        if: steps.stable.outputs.tag != ''
        env:
          TAG: ${{ steps.stable.outputs.tag }}
        run: |
          eval "$(scripts/release-info.sh "$TAG" | grep '^image_tag=')"
          export IMAGE_TAG="$image_tag"
          export HALOS_RELEASE="${TAG#v}"
          scripts/build.sh
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Worked out just before pushing, with every tag so far, so a release made during
          # this build counts and no channel moves back.
          git fetch -q --force --tags origin
          git tag -l 'v*' > "$RUNNER_TEMP/tags"
          channels="$("$RUNNER_TEMP/channels.sh" "$TAG" "$RUNNER_TEMP/tags")"
          # The newest stable release always leads at least the stable channel.
          [ -n "$channels" ] || { echo "no channels for $TAG; nothing was pushed" >&2; exit 1; }
          echo "Moving the channels: $channels"
          # One channel per call, which the push script of older releases also accepts.
          for channel in $channels; do scripts/push-image.sh "$channel"; done
          # Sign it and check every tag just pushed, with main's script (#46).
          image="$(scripts/image-ref.sh)"; base="${image%:*}"
          suffix=""; [ "$HALOGEN_VARIANT" = npu ] || suffix="-no-npu"
          refs=("$image")
          for channel in $channels; do
            refs+=("$base:$channel$suffix")
            [ "$channel" != stable ] || refs+=("$base:latest$suffix")
          done
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" bash "$RUNNER_TEMP/sign-image.sh" "${refs[@]}"
