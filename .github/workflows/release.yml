name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.18.23-alpha.1
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  info:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      channel: ${{ steps.info.outputs.channel }}
      image_tag: ${{ steps.info.outputs.image_tag }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: info
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          scripts/release-info.sh "$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists. Use the next number." >&2
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"

  image:
    needs: info
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [npu, no-npu]
    env:
      HALOGEN_VARIANT: ${{ matrix.variant }}
      IMAGE_TAG: ${{ needs.info.outputs.image_tag }}
      CHANNEL: ${{ needs.info.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - run: tests/run.sh
      - run: scripts/build.sh
      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          scripts/push-image.sh "$CHANNEL"

  iso:
    needs: [info, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [npu, no-npu]
    env:
      HALOGEN_VARIANT: ${{ matrix.variant }}
      IMAGE_TAG: ${{ needs.info.outputs.image_tag }}
      TAG: ${{ needs.info.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-system-x86 qemu-utils ovmf tesseract-ocr genisoimage swtpm swtpm-tools
          # Ubuntu's AppArmor profile for swtpm only allows libvirt's paths.
          if [ -e /etc/apparmor.d/usr.bin.swtpm ]; then sudo apparmor_parser -R /etc/apparmor.d/usr.bin.swtpm || true; fi
          sudo chmod 666 /dev/kvm
      - name: Pull the published image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$(scripts/image-ref.sh)"
      - name: Build ISO
        run: sudo -E scripts/build-iso.sh
      - name: Install and boot with Secure Boot on
        run: tests/iso-install.sh "$(sudo find output -name '*.iso' | head -1)" "$(scripts/image-ref.sh)" install-test "$HALOGEN_VARIANT"
      - name: Package for GitHub Releases
        run: |
          sudo chown -R "$USER" output
          name="halogen-flash-bootc-$TAG-$HALOGEN_VARIANT.iso"
          scripts/package-iso.sh "$(find output -name '*.iso' | head -1)" assets "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: iso-${{ matrix.variant }}
          path: assets/*
          compression-level: 0
          retention-days: 1

  publish:
    needs: [info, iso]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.info.outputs.prerelease }}
          TAG: ${{ needs.info.outputs.tag }}
        run: |
          flags=(--generate-notes --verify-tag --title "$TAG")
          [ "$PRERELEASE" = false ] || flags+=(--prerelease --latest=false)
          gh release create "$TAG" "${flags[@]}" assets/*
